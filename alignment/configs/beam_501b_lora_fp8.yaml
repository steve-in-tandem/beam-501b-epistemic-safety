# ==============================================================================
# Beam-501B Epistemic Safety & RLVR "Proof of Truth" Alignment Configuration
# Target Model: reflectionai/Beam-1.0-501B-A23B
# Architecture: 501B Total Parameters | 23.4B Active Parameters/Token
#               3 Dense Layers + 49 Sparse MoE Layers (256 Routed Experts)
# License: Apache 2.0
# ==============================================================================

base_model: reflectionai/Beam-1.0-501B-A23B
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer
trust_remote_code: true

# FP8 / NVFP4 Quantized Base Weights for Multi-Node H100/H200/B200 Training
load_in_8bit: false
fp8: true
fp8_backend: transformer_engine
bf16: true
tf32: true

# RLVR / On-Policy Direct Preference Optimization (DPO + RPO Anchoring)
rl: dpo
dpo_beta: 0.10
rpo_alpha: 0.25                  # NLL loss weight on chosen Proof-of-Truth traces to prevent reasoning degradation
loss_type: sigmoid

# Dataset Configuration (Generated by alignment/dpo_pair_builder.py)
datasets:
  - path: alignment/dpo_preference_pairs.jsonl
    type: chat_template.default
    field_prompt: prompt
    field_chosen: chosen
    field_rejected: rejected

dataset_prepared_path: alignment/prepared_dpo_cache
val_set_size: 0.05
output_dir: alignment/checkpoints/beam-501b-proof-of-truth-lora

# LoRA Adapter Configuration across 23.4B Active Attention & MoE Expert Pathways
adapter: lora
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target_linear: false
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# Keep MoE router gates frozen to preserve pretrained token-to-expert load balancing
lora_modules_to_save: []

# Special Epistemic Abstention Gate Token
special_tokens:
  additional_special_tokens:
    - "<INSUFFICIENT_EVIDENCE>"

# Sequence & Batching Hyperparameters (12,288 accommodates full-stack SAM.gov multi-attachment prompts + max-effort <think> traces peaking at ~8,952 tokens without truncating closing JSON verdicts)
sequence_len: 12288
sample_packing: false
pad_to_sequence_len: true
micro_batch_size: 1
gradient_accumulation_steps: 16
num_epochs: 3
optimizer: adamw_bnb_8bit
lr_scheduler: cosine
learning_rate: 5.0e-6
warmup_ratio: 0.10
weight_decay: 0.01
max_grad_norm: 1.0

# Memory & Distributed Compute Optimization
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
flash_attention: true
deepspeed: deepspeed_configs/zero3_bf16.json

logging_steps: 1
eval_steps: 25
save_steps: 50
save_total_limit: 3
seed: 42

